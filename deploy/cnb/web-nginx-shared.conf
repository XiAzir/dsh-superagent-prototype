# The access log omits query arguments so launch/session material never enters it.
log_format cnb_superagent_web '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $cnb_superagent_connection {
    default upgrade;
    '' close;
}
limit_conn_zone $binary_remote_addr zone=cnb_superagent_clients:1m;
