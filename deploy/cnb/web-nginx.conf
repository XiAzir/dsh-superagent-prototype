server {
    listen 80;
    listen [::]:80;
    server_name superagent.1994622.xyz;
    access_log /var/log/nginx/superagent.access.log cnb_superagent_web;
    location ^~ /.well-known/acme-challenge/ { root /var/www/cnb-relay-acme; }
    location / { return 301 https://superagent.1994622.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name superagent.1994622.xyz;
    if ($host != superagent.1994622.xyz) { return 444; }
    ssl_certificate /etc/letsencrypt/live/superagent.1994622.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superagent.1994622.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    auth_basic "Superagent";
    auth_basic_user_file /etc/nginx/cnb-superagent.htpasswd;
    access_log /var/log/nginx/superagent.access.log cnb_superagent_web;
    error_log /var/log/nginx/superagent.error.log;
    client_max_body_size 300m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    limit_conn cnb_superagent_clients 30;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:13084;
        proxy_http_version 1.1;
        proxy_set_header Host superagent.1994622.xyz;
        proxy_set_header Authorization "";
        include /etc/nginx/snippets/cnb-superagent-proxy-auth.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cnb_superagent_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}
